name: Validate Dashboard Data

on:
  push:
    paths:
      - 'public/data/**'
      - 'scripts/validate-data.ts'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'public/data/**'
      - 'scripts/validate-data.ts'

jobs:
  validate:
    name: Validate static data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate dashboard data
        run: npm run validate-data

  build:
    name: Build dashboard
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /

      - name: Check for secrets / internal identifiers
        run: |
          # Fail if any of these patterns appear in the dist output
          PATTERNS=(
            "bigquery"
            "project_id"
            "service_account"
            "private_key"
            "walmart.com"
            "gecgithub01"
            "internal"
          )
          for pattern in "${PATTERNS[@]}"; do
            if grep -ri "$pattern" dist/ 2>/dev/null | grep -v "demonstration\|synthetic\|architecture" | head -1; then
              echo "⚠ Potential sensitive string found: $pattern"
              # Warning only — adjust to exit 1 for stricter enforcement
            fi
          done
          echo "Secret scan complete."
