name: Validate Dashboard Data

on:
  push:
    paths:
      - 'data/**'
      - 'index.html'
      - 'scripts/validate-data.ts'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'index.html'
      - 'scripts/validate-data.ts'

jobs:
  validate:
    name: Validate static data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate dashboard data
        run: node --experimental-strip-types scripts/validate-data.ts

      - name: Check for broken absolute paths in index.html
        run: |
          echo "Checking for absolute root paths that break on GitHub Pages subpath..."
          BROKEN=$(grep -nE '(href|src|fetch|location\.href)\s*=?\s*["\x27]/(?!/)' index.html || true)
          if [ -n "$BROKEN" ]; then
            echo "⚠ Absolute root paths found — these break under a repo subpath:"
            echo "$BROKEN"
            exit 1
          fi
          echo "✓ No absolute root paths found"

      - name: Verify all data files present
        run: |
          REQUIRED="manifest.json p0-metrics.json member-lifecycle.json activation.json cohort-retention.json participation-depth.json activity-supply.json activity-mix.json activity-performance.json experiments.json"
          for f in $REQUIRED; do
            if [ ! -f "data/$f" ]; then echo "MISSING: data/$f"; exit 1; fi
            echo "✓ data/$f"
          done

      - name: Check for secrets / internal identifiers in index.html
        run: |
          PATTERNS=("bigquery" "project_id" "service_account" "private_key" "gecgithub01")
          for pattern in "${PATTERNS[@]}"; do
            if grep -i "$pattern" index.html 2>/dev/null | grep -qv "demonstration\|synthetic\|architecture"; then
              echo "⚠ Potential sensitive string: $pattern"
              exit 1
            fi
          done
          echo "✓ Secret scan passed"
